        return;
      }
      elements.entries.innerHTML = state.filteredEntries.map(renderEntry).join("");
    }
    function renderEntry(entry) {
      const id = escapeHtml(entry.id);
      const isOpen = state.openIds.has(entry.id);
      const submitter = escapeHtml(entry.submitted_by || t("entry.unknown"));
      return "<article class=\"entry" + (isOpen ? " open" : "") + "\" id=\"entry-" + id + "\" data-entry-id=\"" + id + "\">" +
        "<button class=\"entry-toggle\" type=\"button\" aria-expanded=\"" + isOpen + "\" aria-controls=\"details-" + id + "\">" +
        "<svg class=\"chevron\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><path d=\"m8 10 4 4 4-4\"></path></svg>" +
        "<span><span class=\"entry-id\">" + id + "</span><span class=\"entry-title\">" + escapeHtml(entry.title) + "</span>" +
        "<span class=\"entry-meta\"><span>" + escapeHtml(labelFor(DOMAIN_LABELS, entry.domain, state.lang)) + "</span><span>" + escapeHtml(entry.date || t("entry.dateUnknown")) + "</span><span>" + t("entry.submittedBy", { name: submitter }) + "</span></span></span>" +
        "<span class=\"category-badge cat-" + escapeHtml(entry.category || "other") + "\">" + escapeHtml(labelFor(CATEGORY_LABELS, entry.category, state.lang)) + "</span></button>" +
        "<div class=\"entry-details\" id=\"details-" + id + "\"" + (isOpen ? "" : " hidden") + ">" + renderDetails(entry) + "</div></article>";
    }
    function renderDetails(entry) {
      const blocks = [
        detailBlock(t("detail.hypothesis"), entry.hypothesis, true),
        detailBlock(t("detail.method"), entry.method, true),
        detailBlock(t("detail.expected"), entry.expected_result, false),
        detailBlock(t("detail.actual"), entry.actual_result, false),
        detailBlock(t("detail.effectSize"), entry.effect_size || t("detail.notReported"), false),
        detailBlock(t("detail.sampleSize"), entry.sample_size || t("detail.notReported"), false),
        detailBlock(t("detail.interpretation"), entry.interpretation, true),
        renderReproducibility(entry.reproducibility),
        detailBlock(t("detail.relatedPositive"), entry.related_positive_result || t("detail.none"), true),
        renderListBlock(t("detail.lessons"), entry.lessons_learned, "lesson-list", true),
        renderListBlock(t("detail.models"), entry.models_used, "fact-list", false),
        renderTagsBlock(entry.tags), renderLinksBlock(entry.links)
      ];
      return "<div class=\"detail-grid\">" + blocks.filter(Boolean).join("") + "</div>";
    }
    function detailBlock(label, value, full) {
      if (value == null || value === "") return "";
      return "<section class=\"detail-block" + (full ? " full" : "") + "\"><h3 class=\"detail-label\">" + escapeHtml(label) + "</h3><p class=\"detail-content\">" + escapeHtml(value) + "</p></section>";
    }
    function renderListBlock(label, values, className, full) {
      if (!Array.isArray(values) || !values.length) return "";
      return "<section class=\"detail-block" + (full ? " full" : "") + "\"><h3 class=\"detail-label\">" + escapeHtml(label) + "</h3><ul class=\"" + className + "\">" + values.map(function (value) { return "<li>" + escapeHtml(value) + "</li>"; }).join("") + "</ul></section>";
    }
    function renderReproducibility(data) {
      if (!data || typeof data !== "object") return "";
      const facts = [];
      if (data.level) facts.push("<li><strong>" + escapeHtml(t("detail.level")) + "</strong>" + escapeHtml(labelFor(REPRO_LABELS, data.level, state.lang)) + "</li>");
      if (Array.isArray(data.artifacts_available) && data.artifacts_available.length) facts.push("<li><strong>" + escapeHtml(t("detail.artifacts")) + "</strong>" + escapeHtml(data.artifacts_available.join(t("general.listSeparator"))) + "</li>");
      if (data.notes) facts.push("<li><strong>" + escapeHtml(t("detail.notes")) + "</strong>" + escapeHtml(data.notes) + "</li>");
      if (!facts.length) return "";
      return "<section class=\"detail-block full\"><h3 class=\"detail-label\">" + escapeHtml(t("detail.reproducibility")) + "</h3><ul class=\"fact-list\">" + facts.join("") + "</ul></section>";
    }
    function renderTagsBlock(tags) {
      if (!Array.isArray(tags) || !tags.length) return "";
      return "<section class=\"detail-block\"><h3 class=\"detail-label\">" + escapeHtml(t("detail.tags")) + "</h3><div class=\"inline-tags\">" + tags.map(function (tag) { return "<span class=\"inline-tag\">" + escapeHtml(tag) + "</span>"; }).join("") + "</div></section>";
    }
    function renderLinksBlock(links) {
      if (!Array.isArray(links) || !links.length) return "";
      const items = links.map(function (link) {
        const href = safeUrl(link && link.url);
        if (!href) return "";
        return "<li><a href=\"" + escapeHtml(href) + "\" target=\"_blank\" rel=\"noopener noreferrer\">" + escapeHtml(link.label || link.url) + "</a></li>";
      }).filter(Boolean);
      if (!items.length) return "";
      return "<section class=\"detail-block\"><h3 class=\"detail-label\">" + escapeHtml(t("detail.links")) + "</h3><ul class=\"link-list\">" + items.join("") + "</ul></section>";
    }
    function toggleEntry(id, updateHash) {
      if (!state.entries.some(function (entry) { return entry.id === id; })) return;
      const opening = !state.openIds.has(id);
      if (opening) state.openIds.add(id); else state.openIds.delete(id);
      const article = document.getElementById("entry-" + id);
      if (article) {
        article.classList.toggle("open", opening);
        article.querySelector(".entry-toggle").setAttribute("aria-expanded", String(opening));
        article.querySelector(".entry-details").hidden = !opening;
      }
      if (updateHash) {
        if (opening) history.replaceState(null, "", "#" + encodeURIComponent(id));
        else if (decodeURIComponent(location.hash.slice(1)) === id) history.replaceState(null, "", location.pathname + location.search);
      }
    }
    function openEntryFromHash(shouldScroll) {
      const id = decodeURIComponent(location.hash.slice(1));
      if (!/^NRR-\d{4}-\d{3}$/.test(id)) return;
      const target = state.entries.find(function (entry) { return entry.id === id; });
      if (!target) return;
      if (state.domain && target.domain !== state.domain) { state.domain = ""; elements.domain.value = ""; }
      if (state.category && target.category !== state.category) { state.category = ""; elements.category.value = ""; }
      if (state.tag && (!target.tags || !target.tags.includes(state.tag))) { state.tag = ""; renderTagCloud(); }
      if (state.search && !searchableText(target).includes(state.search.toLocaleLowerCase(state.lang))) { state.search = ""; elements.search.value = ""; }
      applyFilters();
      if (!state.openIds.has(id)) toggleEntry(id, false);
      if (shouldScroll) requestAnimationFrame(function () {
        const article = document.getElementById("entry-" + id);
        if (article) article.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    }
    function resetFilters() {
      state.search = ""; state.domain = ""; state.category = ""; state.tag = ""; state.sort = "id-desc";
      elements.search.value = ""; elements.domain.value = ""; elements.category.value = ""; elements.sort.value = "id-desc";
      renderTagCloud();
      applyFilters();
      elements.search.focus();
    }
    function showLoadError(error) {
      state.status = "error";
      state.loadError = error;
      if (window.console && console.error) console.error(error);
      renderLoadError();
    }
    async function load() {
      state.status = "loading";
      state.loadError = null;
      renderLoading();
      try { initializeRegistry(await fetchRegistry()); }
      catch (error) { showLoadError(error); }
    }
    elements.search.addEventListener("input", debounce(function (event) {
      state.search = event.target.value; applyFilters();
    }, 300));
    elements.domain.addEventListener("change", function (event) {
      state.domain = event.target.value; applyFilters();
    });
    elements.category.addEventListener("change", function (event) {
      state.category = event.target.value; applyFilters();
    });
    elements.sort.addEventListener("change", function (event) {
      state.sort = SORT_VALUES.includes(event.target.value) ? event.target.value : "id-desc";
      applyFilters();
    });
    elements.reset.addEventListener("click", resetFilters);
    elements.languageSwitcher.addEventListener("click", function (event) {
      const link = event.target.closest("[data-lang]");
      if (!link) return;
      event.preventDefault();
      setLanguage(link.dataset.lang);
    });
    elements.tagCloud.addEventListener("click", function (event) {
      const button = event.target.closest("[data-tag]");
      if (!button) return;
      state.tag = state.tag === button.dataset.tag ? "" : button.dataset.tag;
      renderTagCloud(); applyFilters();
    });
    elements.entries.addEventListener("click", function (event) {
      const button = event.target.closest(".entry-toggle");
      if (!button) return;
      const article = button.closest("[data-entry-id]");
      if (article) toggleEntry(article.dataset.entryId, true);
    });
    window.addEventListener("hashchange", function () { openEntryFromHash(true); });
    restoreFromURL();
    applyLanguage(false);
    load();
  </script></body>
</html>
