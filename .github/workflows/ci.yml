name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install jsonschema

      - name: Schema + internal links + registry consistency
        run: python scripts/validate_ci.py --skip-external-links

      - name: External link check
        run: python -c "
import json, re, urllib.request, urllib.error, sys
from pathlib import Path

PROJECT_ROOT = Path('.')
ENTRIES_DIR = PROJECT_ROOT / 'entries'
url_pattern = re.compile(r'\]\((https?://[^)\s]+)\)')
seen = set()
failed = 0
for entry_dir in sorted(ENTRIES_DIR.iterdir()):
    if not entry_dir.is_dir(): continue
    md = entry_dir / f'{entry_dir.name}.md'
    if not md.exists(): continue
    for url in url_pattern.findall(md.read_text()):
        url = url.rstrip('.)')
        if url in seen: continue
        seen.add(url)
        if 'arxiv.org' in url: continue
        try:
            req = urllib.request.Request(url, method='HEAD')
            req.add_header('User-Agent', 'NRR-CI/1.0')
            urllib.request.urlopen(req, timeout=15)
            print(f'  OK  {url}')
        except urllib.error.HTTPError as e:
            if e.code in (403, 429): print(f'  SKIP  {e.code} {url}'); continue
            print(f'  FAIL  {e.code} {url}')
            failed += 1
        except Exception:
            print(f'  SKIP  (timeout/DNS) {url}')
sys.exit(failed)
"
