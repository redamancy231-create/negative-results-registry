name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install jsonschema

      - name: Schema + internal links + registry consistency
        run: python scripts/validate_ci.py --skip-external-links

      - name: README consistency with registry.json
        run: python scripts/update_readme.py --check

      - name: Cross-locale ID set + root/docs mirror validation
        run: python scripts/build_all.py --check

      - name: External link check (advisory only)
        run: python scripts/check_external_links.py
